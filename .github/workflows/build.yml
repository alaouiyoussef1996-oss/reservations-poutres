name: Build Windows exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name ReservationsPoutre --icon assets/logo.ico --add-data "assets;assets" --add-data "Livret_utilisation.pdf;." app.py
      - run: Compress-Archive -Path dist/ReservationsPoutre -DestinationPath ReservationsPoutre-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ReservationsPoutre-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: ReservationsPoutre-windows, path: ReservationsPoutre-windows.zip }
